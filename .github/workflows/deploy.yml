name: Deploy to production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  ci:
    name: Pre-deploy checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: PHP lint
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -I{} php -l {}

  deploy:
    name: FTP deploy
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-dev --optimize-autoloader

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Sync files over FTPS
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -c "
            set ssl:verify-certificate false
            set ftp:ssl-force true
            set ftp:ssl-protect-data true
            set ftp:passive-mode true
            set net:max-retries 3
            set net:timeout 20
            set cmd:fail-exit true
            open -u ${FTP_USERNAME}, ftp://${FTP_SERVER}
            mirror --reverse --verbose --parallel=8 \
              --exclude-glob .git/ \
              --exclude-glob .github/ \
              --exclude-glob .claude/ \
              --exclude-glob .cursor/ \
              --exclude-glob .env \
              --exclude-glob .env.local \
              --exclude-glob .DS_Store \
              --exclude-glob tests/ \
              --exclude-glob .phpunit.cache/ \
              --exclude-glob phpunit.xml \
              --exclude-glob database.sql \
              --exclude-glob seed.php \
              --exclude-glob composer.phar \
              --exclude-glob config/database.local.php \
              --exclude-glob deploy/server-setup.sh \
              --exclude-glob uploads/slips/* \
              --exclude-glob uploads/events/* \
              --exclude-glob uploads/logos/* \
              ./ ./
          "

      - name: Deployment summary
        run: |
          echo "Deployed ${{ github.sha }} from ${{ github.ref_name }} to ${{ secrets.FTP_SERVER }}"
