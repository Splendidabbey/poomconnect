# Paste into aaPanel → Website → poomconnect.com → Config
# (inside the server { } block, before the PHP location).
#
# Maps /login → login.php, /admin → admin/dashboard.php, /events → events.php, etc.
# Existing files such as /api/stripe-webhook.php keep working.

location ^~ /config/ { deny all; }
location ^~ /includes/ { deny all; }
location ^~ /src/ { deny all; }
location ^~ /vendor/ { deny all; }
location ^~ /tests/ { deny all; }
location ^~ /migrations/ { deny all; }
location ^~ /cron/ { deny all; }
location ^~ /deploy/ { deny all; }
location ^~ /lang/ { deny all; }

location = /admin {
    rewrite ^ /admin/dashboard.php last;
}
location = /admin/ {
    rewrite ^ /admin/dashboard.php last;
}
location = /organizer {
    rewrite ^ /organizer/dashboard.php last;
}
location = /organizer/ {
    rewrite ^ /organizer/dashboard.php last;
}

location = /robots.txt {
    rewrite ^ /robots.php last;
}
location = /sitemap.xml {
    rewrite ^ /sitemap.php last;
}
location = /og-image {
    rewrite ^ /og-image.php last;
}

location / {
    try_files $uri $uri/ @extensionless;
}

location @extensionless {
    rewrite ^/(.+)/?$ /$1.php last;
}
