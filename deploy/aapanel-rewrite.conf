# aaPanel Rewrite is often inserted INSIDE `location / { ... }`.
# Nested `location` blocks are invalid there and nginx will refuse to reload
# (the old config stays, so /login keeps 404-ing).
#
# Paste ONLY the three lines below — no location { } wrappers.
# Website → poomconnect.com → Rewrite → Save → Reload nginx.

if (!-e $request_filename) {
    rewrite ^/(.+)/?$ /$1.php last;
}
